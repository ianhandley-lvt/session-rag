[project]
name = "claude-session-rag"
version = "0.1.0"
description = "Project-scoped local retrieval for Claude Code session history"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastembed>=0.7,<0.8",
  "lancedb>=0.25,<0.26",
]

[project.scripts]
session-rag = "session_rag.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/session_rag"]
